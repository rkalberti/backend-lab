<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro</title>
    <script>
        function pesquisarCep(){
            erro.textContent = ""
            document.getElementById("rua").value = ""
            document.getElementById("bairro").value = ""
            document.getElementById("cidade").value = ""
            document.getElementById("estado").value = ""

            var validacep = /^[0-9]{8}$/
            const cep = document.getElementById ("cep").value

            if(validacep.test(cep)){
                const link =  "https://viacep.com.br/ws/" + cep + "/json/?callback=preencherEndereco"
            var script = document.createElement("script")
            script.src = link
            document.body.appendChild(script) 
            } else {
                erro.textContent = "O CEP digitado está errado"
                document.getElementById("cep").value = ""
            }
        }

        function preencherEndereco(conteudo){
         if (!("erro" in conteudo)) {
           document.getElementById("rua").value = conteudo.logradouro
           document.getElementById("bairro").value = conteudo.bairro
           document.getElementById("cidade").value = conteudo.localidade
           document.getElementById("uf").value = conteudo.estado
           document.getElementById("uf").value = conteudo.estado
         }else { 
            erro.textContent = "O CEP digitado não existe"
         }
        }
    </script>
</head>
<body>
    <header>

    </header>

    <main>
    <h1>Cadastro de clientes</h1>
    <form>
        <label for="nome">Nome:</label> 
        <input type="text" id="nome" placeholder="Digite o seu nome aqui" required>

        <label for="email">Email:</label> 
        <input type="email" id="email" placeholder="exemplo@gmail.com" required>

        <label for="celular">Celular:</label> 
        <input type="tel" id="celular" placeholder="(00) 00000-0000" required>

        <label for="cpf">CPF:</label> 
        <input type="text" id="cpf" placeholder="000.000.000-00" required>

        <label for="cep">CEP:</label> 
        <input type="text" id="cep" onblur="pesquisarCep()" placeholder="00000-000" required>

        <p id="erro"></p>

        <label for="rua">Rua:</label> 
        <input type="text" id="rua" placeholder="Rua Princesa Isabel" required>

        <label for="numero">Número:</label> 
        <input type="text" id="numero" placeholder="77" required>

        <label for="bairro">Bairro:</label> 
        <input type="text" id="bairro" placeholder="Vila Belmiro" required>

        <label for="cidade">Cidade:</label> 
        <input type="text" id="cidade" placeholder="Santos" required>

        <label for="uf">Estado/UF:</label> 
        <input type="text" id="uf" placeholder="São Paulo" required>

        <label for="senha">Senha:</label> 
        <input type="text" id="senha" required>

        <input type="submit" value="Enviar Cadastro" class="btn_enviar">

    </form>
    </main>

    <footer>

    </footer>
</body>
</html>
